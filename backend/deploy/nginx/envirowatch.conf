map $http_upgrade $envirowatch_connection {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=envirowatch_auth:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=envirowatch_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=envirowatch_ingest:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=envirowatch_connections:10m;

upstream envirowatch_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 127.0.0.1:8080;
    server_name localhost;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn envirowatch_connections 20;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location = /api/v1/auth/login {
        limit_req zone=envirowatch_auth burst=5 nodelay;
        proxy_pass http://envirowatch_backend;
    }

    location = /api/v1/ingest {
        client_max_body_size 64k;
        limit_req zone=envirowatch_ingest burst=100 nodelay;
        proxy_pass http://envirowatch_backend;
    }

    location = /api/v1/auth/ws {
        limit_req zone=envirowatch_api burst=10 nodelay;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $envirowatch_connection;
        proxy_read_timeout 75s;
        proxy_pass http://envirowatch_backend;
    }

    location /api/ {
        limit_req zone=envirowatch_api burst=60 nodelay;
        proxy_pass http://envirowatch_backend;
    }

    location / {
        return 404;
    }
}
