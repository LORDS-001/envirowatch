name: Project checks

on:
  pull_request:
  push:
    branches: [main, backend]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: envirowatch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d envirowatch_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://test:isolated-ci-only@127.0.0.1:5432/envirowatch_test
      TEST_DATABASE_URL: postgresql+psycopg://test:isolated-ci-only@127.0.0.1:5432/envirowatch_test
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: isolated-ci-signing-key-not-for-production-usage
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: npm ci
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/python -m pip install -r backend/requirements.txt
      - run: npm run check
      - run: npm run build
      - run: backend/.venv/bin/python -m pip check
      - run: backend/.venv/bin/python -m pytest backend/tests -q
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run e2e:real
